<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Joy — Cardápio de Tapiocas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FBF1DD;
    --cream-card: #FFFBF3;
    --coffee: #4A2E1C;
    --coffee-soft: #7A5233;
    --gold: #F4B942;
    --gold-deep: #D99A1F;
    --orange: #E3792D;
    --orange-deep: #B9502A;
    --line: rgba(74,46,28,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 10% 5%, rgba(244,185,66,0.18), transparent 40%),
      radial-gradient(circle at 90% 15%, rgba(227,121,45,0.14), transparent 45%);
    color:var(--coffee);
    font-family:'Nunito', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 20px 100px;}

  /* HERO */
  header{padding:36px 20px 22px;text-align:center;}
  .logo{
    display:block;
    width:220px;
    max-width:70%;
    margin:0 auto;
    filter:drop-shadow(0 6px 14px rgba(74,46,28,0.22));
  }
  .tagline{
    margin:8px 0 0;
    font-weight:700;
    color:var(--coffee-soft);
    font-size:15px;
  }

  /* SOCIAL ROW */
  .social-row{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .pill-link{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:9px 16px;
    border-radius:999px;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:14px;
    text-decoration:none;
    border:2px solid var(--line);
    color:var(--coffee);
    background:var(--cream-card);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .pill-link svg{width:16px;height:16px;flex:none;}
  .pill-link.insta{border-color:#E3792D55;}
  .pill-link.wa{background:#25D366;border-color:#25D366;color:#fff;}
  .pill-link:active{transform:scale(0.96);}

  /* TABS */
  nav.tabs{
    display:flex;
    gap:8px;
    margin:28px 0 4px;
    background:var(--cream-card);
    padding:6px;
    border-radius:16px;
    border:2px solid var(--line);
  }
  nav.tabs button{
    flex:1;
    border:none;
    background:transparent;
    font-family:'Baloo 2', sans-serif;
    font-size:14.5px;
    font-weight:600;
    color:var(--coffee-soft);
    padding:10px 4px;
    border-radius:11px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  nav.tabs button.active{
    background:var(--orange);
    color:#fff;
    box-shadow:0 3px 0 var(--orange-deep);
  }

  /* CATEGORY PANELS */
  section.panel{display:none;padding-top:22px;}
  section.panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .item{
    padding:16px 0;
    border-bottom:1.5px dashed var(--line);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .item:last-child{border-bottom:none;}
  .item-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .item-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--coffee);
  }
  .item-price{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    color:#fff;
    background:var(--coffee);
    padding:4px 12px;
    border-radius:999px;
    white-space:nowrap;
    box-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  .item-desc{
    font-size:13.5px;
    color:var(--coffee-soft);
    font-weight:600;
  }
  .item-order{
    align-self:flex-start;
    margin-top:8px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--orange-deep);
    text-decoration:none;
    padding:6px 2px;
  }
  .item-order svg{width:14px;height:14px;}
  .item-order:active{opacity:.6;}

  .cat-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.3px;
    color:var(--gold-deep);
    margin:0 0 4px;
  }

  footer{
    text-align:center;
    margin-top:36px;
    font-size:12.5px;
    color:var(--coffee-soft);
    font-weight:700;
  }

  /* FLOATING ORDER BUTTON */
  .float-order{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    background:#25D366;
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:13px 26px;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    box-shadow:0 6px 18px rgba(37,211,102,0.45);
    z-index:20;
  }
  .float-order svg{width:19px;height:19px;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <img class="logo" src="logo.jpg" alt="Tap Joy">
    <p class="tagline">Tapiocas feitas na hora, do seu jeito</p>

    <div class="social-row">
      <a class="pill-link insta" href="https://www.instagram.com/reels/audio/571475047470988?igsi=OHhzNTBucDgxa3hq" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E3792D" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        Instagram
      </a>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="classicas">Clássicas</button>
    <button class="tab-btn" data-tab="tradicionais">Tradicionais</button>
    <button class="tab-btn" data-tab="especiais">Especiais</button>
  </nav>

  <section class="panel active" id="classicas"></section>
  <section class="panel" id="tradicionais"></section>
  <section class="panel" id="especiais"></section>

</div>

<a class="float-order" id="floatOrder" href="#" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.1-1.33A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.6-1.3 1.16-1.8 1.2-.46.05-1.03.07-1.66-.1-.38-.1-.87-.28-1.5-.55-2.64-1.14-4.36-3.8-4.5-3.98-.13-.18-1.07-1.42-1.07-2.7 0-1.29.68-1.92.92-2.18.24-.26.53-.32.7-.32h.5c.16 0 .38-.06.6.45.22.53.75 1.83.82 1.96.07.13.11.29.02.47-.09.18-.14.29-.27.45-.13.15-.28.34-.4.46-.13.13-.27.28-.12.55.16.27.7 1.15 1.5 1.86 1.03.92 1.9 1.2 2.17 1.34.27.13.43.11.6-.07.16-.18.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.8.85.27.13.44.2.5.31.07.11.07.63-.15 1.24z"/></svg>
  Fazer pedido no WhatsApp
</a>

<script>
  const WHATSAPP_NUMBER = "5511986205401";

  const menu = {
    classicas: [
      { name: "Mussarela", price: "R$ 11,00" },
      { name: "Pizza", desc: "mussarela, tomate e orégano", price: "R$ 11,00" },
      { name: "Presunto e Queijo", price: "R$ 12,00" },
      { name: "Bauru", desc: "mussarela, presunto, tomate e orégano", price: "R$ 14,00" },
    ],
    tradicionais: [
      { name: "Frango com Requeijão Cremoso e Mussarela", price: "R$ 15,00" },
      { name: "Queijo Branco", price: "R$ 15,00" },
    ],
    especiais: [
      { name: "Queijo Branco com Peito de Peru", price: "R$ 16,00" },
      { name: "Carne Seca com Requeijão Cremoso e Mussarela", price: "R$ 20,00" },
      { name: "Salame com Requeijão Cremoso e Mussarela", price: "R$ 18,00" },
      { name: "3 Queijos", desc: "mussarela, requeijão cremoso e queijo branco", price: "R$ 16,00" },
      { name: "Calabresa", desc: "calabresa, requeijão cremoso e mussarela", price: "R$ 15,00" },
      { name: "3 Queijos com Peito de Peru", desc: "mussarela, requeijão cremoso e queijo branco", price: "R$ 18,00" },
    ],
  };

  const catLabels = {
    classicas: "Clássicas",
    tradicionais: "Tradicionais",
    especiais: "Especiais",
  };

  function waLink(itemName){
    const text = `Olá! Vim pelo cardápio e quero pedir uma tapioca de ${itemName}.`;
    return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
  }

  function renderMenu(){
    Object.keys(menu).forEach(cat => {
      const panel = document.getElementById(cat);
      let html = `<p class="cat-title">${catLabels[cat].toUpperCase()}</p>`;
      menu[cat].forEach(item => {
        html += `
          <div class="item">
            <div class="item-top">
              <span class="item-name">${item.name}</span>
              <span class="item-price">${item.price}</span>
            </div>
            ${item.desc ? `<span class="item-desc">${item.desc}</span>` : ""}
            <a class="item-order" href="${waLink(item.name)}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="#B9502A"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.1-1.33A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
              Pedir essa
            </a>
          </div>`;
      });
      panel.innerHTML = html;
    });
  }

  function setupTabs(){
    const buttons = document.querySelectorAll(".tab-btn");
    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });
  }

  function setupFloatButton(){
    document.getElementById("floatOrder").href =
      `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("Olá! Vim pelo cardápio do Tap Joy e quero fazer um pedido.")}`;
  }

  renderMenu();
  setupTabs();
  setupFloatButton();
</script>

</body>
</html>
